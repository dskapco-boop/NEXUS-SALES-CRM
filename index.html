<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Nexus CRM - B2B Sales & ISO Consultancy</title>
    <meta name="description" content="Nexus CRM - Zero-cost B2B sales CRM for general trading and ISO consultancy companies" />
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nexus CRM" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply saved theme preference
      const savedTheme = localStorage.getItem('theme') || 'light'
      document.documentElement.classList.add(savedTheme)
      document.documentElement.style.scrollBehavior = 'smooth'
    </script>
  </head>
  <body class="bg-background transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
